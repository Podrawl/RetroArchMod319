name: Ler desenho de retangulos e texto 2 (somente leitura)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair
        run: |
          set +e
          git clone --depth 1 -q https://github.com/libretro/RetroArch.git ra
          git -C ra fetch --depth 1 -q origin 0247447b60c4a9905fc5dd353ab7b3114b23768f
          git -C ra checkout -q FETCH_HEAD
          S=01-ANALISE/desenho-widgets2
          mkdir -p $S
          sed -n '2095,2172p' ra/gfx/gfx_widgets.c > $S/10-inicio-funcao.txt
          sed -n '1070,1100p' ra/gfx/gfx_widgets.c > $S/11-uso-texto.txt
          sed -n '2260,2335p' ra/gfx/gfx_widgets.c > $S/12-depois-ai.txt
          grep -rn 'TEXT_ALIGN_CENTER' ra/gfx/font_driver.h ra/font_driver.h > $S/13-align.txt
          grep -n 'font_data_t' ra/gfx/gfx_widgets.h > $S/14-font-campo.txt
          rm -rf ra
          git config user.name "bot"; git config user.email "bot@example.com"
          git add $S
          git commit -m "Leitura 12b: desenho de retangulos e texto" && git pull --rebase -q && git push
