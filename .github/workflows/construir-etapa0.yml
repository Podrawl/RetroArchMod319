name: Etapa 0 - RetroArch com pacote próprio (sem mudar comportamento)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Baixar código oficial
        run: git clone --depth 1 -q https://github.com/libretro/RetroArch.git ra
      - name: Instalar NDK e ferramentas pedidas
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "build-tools;36.0.0" "platforms;android-36" > /dev/null || true
      - name: Trocar nome do pacote e do app (só isso)
        run: |
          python3 - <<'PY'
          p='ra/pkg/android/phoenix/build.gradle'
          s=open(p).read()
          old="""    aarch64 {
      applicationIdSuffix '.aarch64'
      resValue "string", "app_name", "RetroArch (AArch64)\""""
          new="""    aarch64 {
      applicationIdSuffix '.aarch64.mod'
      resValue "string", "app_name", "RetroArch Mod\""""
          assert s.count(old)==1, "trecho nao encontrado exatamente uma vez"
          open(p,'w').write(s.replace(old,new))
          PY
          cd ra && git diff --stat && git diff | head -30
      - name: Compilar
        run: |
          set +e
          START=$(date +%s)
          cd ra/pkg/android/phoenix
          G=gradle; [ -x ./gradlew ] && G=./gradlew
          $G assembleAarch64Release --no-daemon \
            -PRELEASE_STORE_FILE=$GITHUB_WORKSPACE/chaves/retroarchmod.jks \
            -PRELEASE_STORE_PASSWORD=senha-de-teste \
            -PRELEASE_KEY_ALIAS=teste \
            -PRELEASE_KEY_PASSWORD=senha-de-teste > $GITHUB_WORKSPACE/build.log 2>&1
          echo "codigo=$? tempo=$(( $(date +%s) - START ))" > $GITHUB_WORKSPACE/tempo.txt
          exit 0
      - name: Conferir APK
        run: |
          set +e
          mkdir -p 01-ANALISE/etapa0
          APK=$(find ra/pkg/android/phoenix -name "*.apk" | head -1)
          echo "$APK" > 01-ANALISE/etapa0/apk.txt
          cp tempo.txt 01-ANALISE/etapa0/tempo.txt
          tail -40 build.log > 01-ANALISE/etapa0/fim-do-log.txt
          if [ -n "$APK" ]; then
            cp "$APK" retroarch-mod-etapa0.apk
            AAPT2=$(ls $ANDROID_HOME/build-tools/36.0.0/aapt2)
            $AAPT2 dump badging "$APK" 2>&1 | grep -E "^package:|application-label:|sdkVersion|native-code" > 01-ANALISE/etapa0/badging.txt
            $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK" 2>&1 | head -5 > 01-ANALISE/etapa0/assinatura.txt
            ls -l "$APK" > 01-ANALISE/etapa0/tamanho.txt
          fi
          grep -rn "com.retroarch" ra/pkg/android/phoenix/AndroidManifest.xml | head -20 > 01-ANALISE/etapa0/manifest-com-retroarch.txt
      - name: Conferir overlays flat (somente leitura)
        run: |
          set +e
          git clone --depth 1 -q https://github.com/libretro/common-overlays.git co
          mkdir -p 01-ANALISE/flat
          ls co/gamepads 2>&1 | head -50 > 01-ANALISE/flat/pastas-gamepads.txt
          ls co/gamepads/flat 2>&1 | head -150 > 01-ANALISE/flat/arquivos.txt
          for c in psx gba neogeo; do
            f=co/gamepads/flat/$c.cfg
            if [ -f "$f" ]; then
              wc -l "$f" > 01-ANALISE/flat/$c-linhas.txt
              grep -c "_desc[0-9]*_overlay" "$f" > 01-ANALISE/flat/$c-descs-com-imagem.txt
              grep -E "^overlays|_overlay =|_name|_normalized|_full_screen|_viewport|_range_mod|_rect|_aspect" "$f" | head -60 > 01-ANALISE/flat/$c-chaves.txt
              grep -E "overlay_next|analog|dpad_area|abxy_area|save_state|load_state|menu_toggle" "$f" | head -30 > 01-ANALISE/flat/$c-especiais.txt
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: RetroArchMod-etapa0
          path: retroarch-mod-etapa0.apk
          if-no-files-found: warn
      - name: Guardar relatórios
        run: |
          git config user.name "bot"; git config user.email "bot@example.com"
          git add 01-ANALISE/etapa0 01-ANALISE/flat
          git commit -m "Resultado da etapa 0 e leitura da pasta flat" && git pull --rebase -q && git push
