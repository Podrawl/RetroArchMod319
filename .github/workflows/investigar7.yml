name: Ler ciclo de vida do app Android 2 (somente leitura)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair trechos
        run: |
          set +e
          git clone --depth 1 -q https://github.com/libretro/RetroArch.git ra
          S=01-ANALISE/ciclo-de-vida2
          mkdir -p $S
          sed -n '985,1140p' ra/input/drivers/android_input.c > $S/10-cmd-985.txt
          sed -n '735,800p' ra/input/drivers/android_input.c > $S/11-pause-ack.txt
          rm -rf ra
          git config user.name "bot"; git config user.email "bot@example.com"
          git add $S
          git commit -m "Leitura 7d: ciclo de vida" && git pull --rebase -q && git push
