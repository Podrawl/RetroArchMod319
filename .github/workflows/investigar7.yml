name: Ler tratamento do botão Voltar 2 (somente leitura)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair trechos
        run: |
          set +e
          git clone --depth 1 -q https://github.com/libretro/RetroArch.git ra
          S=01-ANALISE/botao-voltar2
          mkdir -p $S
          cd ra
          sed -n '1975,2010p' input/drivers/android_input.c > ../$S/10-android-1985.txt
          sed -n '2505,2575p' input/drivers/android_input.c > ../$S/11-android-2527.txt
          sed -n '3660,3685p' input/drivers/android_input.c > ../$S/12-android-3675.txt
          sed -n '1845,1890p' pkg/android/phoenix-common/src/com/retroarch/browser/retroactivity/RetroActivityCommon.java > ../$S/13-java-1865.txt
          grep -rn "platform_menu_button" --include=*.c --include=*.h . | head -30 > ../$S/14-platform-menu-button.txt
          grep -n "menu_toggle\|MENU_TOGGLE" input/drivers/android_input.c | head -20 > ../$S/15-android-menu-toggle.txt
          cd ..
          rm -rf ra
          git config user.name "bot"; git config user.email "bot@example.com"
          git add $S
          git commit -m "Leitura 7b: botão Voltar" && git pull --rebase -q && git push
