name: Ler exemplos de ação simples do menu (somente leitura)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair trechos
        run: |
          set +e
          git clone --depth 1 -q https://github.com/libretro/RetroArch.git ra
          S=01-ANALISE/modelo-entrada-menu3
          mkdir -p $S
          cd ra
          grep -n "define STATIC_DEFAULT_ACTION_OK_CMD_FUNC" -A12 menu/cbs/menu_cbs_ok.c > ../$S/10-macro-cmd-func.txt
          sed -n '10225,10262p' menu/cbs/menu_cbs_ok.c > ../$S/11-tabela-labels.txt
          grep -n "runloop_msg_queue_push" menu/cbs/menu_cbs_ok.c | head -5 > ../$S/12-msg-push-uso.txt
          grep -n -A8 "runloop_msg_queue_push(" menu/cbs/menu_cbs_ok.c | sed -n '1,30p' > ../$S/13-msg-push-contexto.txt
          grep -n "CMD_EVENT_PAUSE\b\|CMD_EVENT_UNPAUSE\|CMD_EVENT_RESUME\b\|CMD_EVENT_MENU_PAUSE_LIBRETRO" command.h command.c | head -20 > ../$S/14-cmd-pause.txt
          grep -n "runloop_msg_queue_push" runloop.h retroarch.h | head -5 > ../$S/15-msg-push-decl.txt
          grep -n "action_ok_set_path\|static int action_ok_overlay\|action_ok_.*overlay" menu/cbs/menu_cbs_ok.c | head -10 > ../$S/16-ok-overlay.txt
          cd ..
          rm -rf ra
          git config user.name "bot"; git config user.email "bot@example.com"
          git add $S
          git commit -m "Leitura 6c" && git pull --rebase -q && git push
