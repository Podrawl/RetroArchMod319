name: Teste de tempo de compilação (RetroArch original, sem alterações)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Versão do RetroArch"
        default: "master"

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Baixar código oficial
        run: |
          git clone --depth 1 --branch "${{ inputs.tag }}" -q https://github.com/libretro/RetroArch.git ra
      - name: Instalar NDK pedido pelo projeto
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "build-tools;36.0.0" "platforms;android-36" > /dev/null || true
      - name: Compilar (arm64, debug)
        run: |
          set +e
          START=$(date +%s)
          ls ra/pkg/android > build.log 2>&1
          cd ra/pkg/android/phoenix || { echo "codigo=99 sem_pasta" > tempo.txt; exit 0; }
          G=gradle; [ -x ./gradlew ] && G=./gradlew
          $G assembleAarch64Debug --no-daemon --stacktrace > ../../../../build.log 2>&1
          RC=$?
          END=$(date +%s)
          echo "codigo=$RC tempo_segundos=$((END-START))" > ../../../../tempo.txt
          exit 0
      - name: Guardar resultado no repositório
        run: |
          mkdir -p 01-ANALISE/compilacao
          cp tempo.txt 01-ANALISE/compilacao/tempo.txt
          tail -80 build.log > 01-ANALISE/compilacao/fim-do-log.txt
          find ra/pkg/android/phoenix -name "*.apk" -exec ls -l {} \; > 01-ANALISE/compilacao/apks.txt
          git config user.name "bot"; git config user.email "bot@example.com"
          git add 01-ANALISE/compilacao
          git commit -m "Resultado do teste de tempo de compilação" && git pull --rebase -q && git push
