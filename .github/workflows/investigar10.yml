name: Ler struct do viewport (somente leitura)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair
        run: |
          set +e
          git clone --depth 1 -q https://github.com/libretro/RetroArch.git ra
          S=01-ANALISE/campos-proporcao
          cd ra
          grep -rn "define VIDEO_POS_PACK\|define VIDEO_POS_X\|define VIDEO_POS_Y\|define VIDEO_SCALE_PACK\|define VIDEO_SCALE_W\|define VIDEO_SCALE_H" --include=*.h . | cut -c1-200 > ../$S/20-macros.txt
          grep -rn "^typedef struct video_viewport\|^struct video_viewport" --include=*.h . | head -5 > ../$S/21-struct-onde.txt
          F=$(grep -rln "^typedef struct video_viewport\|^struct video_viewport" --include=*.h . | head -1)
          L=$(grep -n "^typedef struct video_viewport\|^struct video_viewport" $F | head -1 | cut -d: -f1)
          sed -n "${L},$((L+30))p" $F > ../$S/22-struct-corpo.txt
          grep -n "video_driver_get_size" gfx/video_driver.h | head -3 > ../$S/23-get-size.txt
          sed -n '2200,2215p' gfx/gfx_widgets.c > ../$S/24-widgets-uso.txt
          cd ..
          rm -rf ra
          git config user.name "bot"; git config user.email "bot@example.com"
          git add $S
          git commit -m "Leitura 10b: struct viewport e macros" && git pull --rebase -q && git push
