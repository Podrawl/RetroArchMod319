name: Ler troca de pagina do overlay 2 (somente leitura)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair
        run: |
          set +e
          git clone --depth 1 -q https://github.com/libretro/RetroArch.git ra
          git -C ra fetch --depth 1 -q origin 0247447b60c4a9905fc5dd353ab7b3114b23768f
          git -C ra checkout -q FETCH_HEAD
          S=01-ANALISE/troca-pagina3
          mkdir -p $S
          grep -rn 'CMD_EVENT_OVERLAY_NEXT' ra --include=*.c --include=*.h > $S/01-cmd-usos.txt
          L=$(grep -n 'case CMD_EVENT_OVERLAY_NEXT' ra/command.c | head -1 | cut -d: -f1)
          sed -n "$((L-2)),$((L+40))p" ra/command.c > $S/02-cmd.txt
          sed -n 355,375p ra/input/input_overlay.h > $S/03-name.txt
          grep -rn 'input_overlay_set_next\|input_overlay_next\|next_index' ra --include=*.c --include=*.h | head -40 > $S/04-next-uso.txt
          sed -n 14215,14245p ra/input/input_driver.c > $S/05-14231.txt
          rm -rf ra
          git config user.name "bot"; git config user.email "bot@example.com"
          git add $S
          git commit -m "Leitura 14c" && git pull --rebase -q && git push
