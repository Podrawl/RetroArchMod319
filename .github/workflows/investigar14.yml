name: Ler troca de pagina do overlay 2 (somente leitura)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair
        run: |
          set +e
          git clone --depth 1 -q https://github.com/libretro/RetroArch.git ra
          git -C ra fetch --depth 1 -q origin 0247447b60c4a9905fc5dd353ab7b3114b23768f
          git -C ra checkout -q FETCH_HEAD
          S=01-ANALISE/troca-pagina4
          mkdir -p $S
          sed -n 5028,5062p ra/retroarch.c > $S/01-next.txt
          grep -n 'input_overlay_set_next_index\|overlay_ptr->index\|ol->index\|->index *=' ra/input/input_overlay.c ra/input/input_overlay.h ra/retroarch.c ra/input/input_driver.c ra/input/input_overlay_textures.c 2>/dev/null | head -30 > $S/02-index.txt
          rm -rf ra
          git config user.name "bot"; git config user.email "bot@example.com"
          git add $S
          git commit -m "Leitura 14d" && git pull --rebase -q && git push
